services:
  frontend:
    build: ./frontend
    ports: ["${APP_PORT:-8080}:80"]
    depends_on: [backend]
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://contribcompass:${POSTGRES_PASSWORD:-change-me}@postgres:5432/contribcompass
      GITHUB_TIMEOUT_SECONDS: ${GITHUB_TIMEOUT_SECONDS:-15}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      MAX_ISSUES: ${MAX_ISSUES:-30}
      MAX_IMPORTANT_FILES: ${MAX_IMPORTANT_FILES:-24}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-200000}
      MAX_README_SIZE: ${MAX_README_SIZE:-100000}
      MAX_CONTEXT_SIZE: ${MAX_CONTEXT_SIZE:-24000}
      MAX_TREE_ENTRIES: ${MAX_TREE_ENTRIES:-50000}
      MAX_GITHUB_REQUESTS_PER_ANALYSIS: ${MAX_GITHUB_REQUESTS_PER_ANALYSIS:-32}
      MAX_ANALYSIS_TIME: ${MAX_ANALYSIS_TIME:-120}
      ANALYZE_RATE_LIMIT_PER_IP: ${ANALYZE_RATE_LIMIT_PER_IP:-10}
      ANALYZE_RATE_LIMIT_WINDOW: ${ANALYZE_RATE_LIMIT_WINDOW:-3600}
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-4}
      ANALYSIS_CACHE_FRESH_SECONDS: ${ANALYSIS_CACHE_FRESH_SECONDS:-60}
      ANALYSIS_CACHE_TTL_SECONDS: ${ANALYSIS_CACHE_TTL_SECONDS:-600}
    depends_on:
      ollama: {condition: service_started}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama_data:/root/.ollama"]
    # Pull the configured model once after startup: docker compose exec ollama ollama pull qwen3:4b
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contribcompass
      POSTGRES_USER: contribcompass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U contribcompass -d contribcompass"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 5}
    restart: unless-stopped
volumes:
  ollama_data:
  postgres_data:
  redis_data:
